<div class="slide">
<h2>A tool says pass. A person says satisfied.</h2>
<svg viewBox="0 0 1180 450" role="img" aria-label="Requirement, evidence, automated verdict, attestation by a qualified engineer">
<defs>
<marker id="th-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker>
</defs>
<!-- 1 requirement -->
<rect class="box" x="0" y="135" width="190" height="160" rx="10"/>
<text class="h1t anc" x="95" y="222">Requirement</text>
<!-- arrows -->
<path class="arr" d="M194,215 H244" marker-end="url(#th-ah)"/>
<path class="arr" d="M476,215 H526" marker-end="url(#th-ah)"/>
<path class="arr" d="M756,215 H806" marker-end="url(#th-ah)"/>
<!-- 2 evidence: a stack of three cards -->
<text class="h1t anc" x="360" y="96">Evidence</text>
<rect class="mach" x="270" y="119" width="200" height="54" rx="10"/><text class="lbl anc" x="370" y="153">simulation</text>
<rect class="mach" x="260" y="188" width="200" height="54" rx="10"/><text class="lbl anc" x="360" y="222">symbolic</text>
<rect class="mach" x="250" y="257" width="200" height="54" rx="10"/><text class="lbl anc" x="350" y="291">formal</text>
<!-- 3 automated verdict -->
<rect class="machT" x="530" y="135" width="220" height="160" rx="10"/>
<text class="h1t anc" x="640" y="188">Automated</text><text class="h1t anc" x="640" y="218">verdict</text>
<rect x="595" y="238" width="90" height="38" rx="19" fill="#1a7f37"/><text class="h2t anc" x="640" y="264" style="fill:#ffffff">pass</text>
<!-- 4 attestation: the focal point -->
<rect class="human" x="810" y="55" width="370" height="320" rx="12"/>
<circle cx="995" cy="112" r="17" fill="#d97706"/>
<path d="M963,162 C963,138 977,132 995,132 C1013,132 1027,138 1027,162 Z" fill="#d97706"/>
<text class="amb anc" x="995" y="212" style="font-size:32px;font-weight:700">Attestation</text>
<text class="lbl anc" x="995" y="248" style="fill:#111111">by a qualified engineer</text>
<rect x="885" y="290" width="220" height="52" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<text class="lbl anc" x="995" y="324" style="fill:#111111">with rationale</text>
<!-- brackets -->
<path d="M250,398 H750" stroke="#2166ac" stroke-width="2" fill="none"/>
<text class="lbl blu anc" x="500" y="430">automated</text>
<path d="M810,398 H1180" stroke="#d97706" stroke-width="3" fill="none"/>
<text class="lbl amb anc" x="995" y="430" style="font-weight:700">a person signs (attests)</text>
</svg>
<p class="cap">Evidence supports a judgment. It does not satisfy a requirement by itself.</p>
</div>
