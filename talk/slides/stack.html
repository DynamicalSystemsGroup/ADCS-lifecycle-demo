<div class="slide">
<h2>Where open source fits in systems engineering</h2>
<svg viewBox="0 0 1180 496" role="img" aria-label="Four layers built from the bottom up: standards, open-source software, controlled work environments, engineering organizations; feedback runs back down">
<defs>
<marker id="st-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker>
<marker id="st-fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<!-- left axis: stability at the base, responsibility at the top -->
<path class="arrM" d="M40,484 V20" marker-end="url(#st-fb)"/>
<text class="sub" x="56" y="34">accountable for outcomes</text>
<text class="sub" x="56" y="490">slow, stable foundation</text>
<!-- 4: engineering organizations (top) -->
<rect class="human" x="150" y="48" width="860" height="84" rx="12"/>
<text class="h1t" x="180" y="98">Engineering organizations</text>
<text class="lbl mut" x="530" y="98">do the engineering; own the outcome</text>

<rect class="hair" x="150" y="160" width="860" height="84" rx="12"/>
<text class="h1t" x="180" y="210">Controlled work environments</text>
<text class="lbl mut" x="530" y="210">hosted by the organization or its tool vendors</text>

<rect class="hair" x="150" y="384" width="860" height="84" rx="12"/>
<text class="h1t" x="180" y="434">Standards</text>
