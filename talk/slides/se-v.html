<div class="slide">
<h2>Specify down, integrate up, then a person judges</h2>
<svg viewBox="0 0 1180 400" role="img" aria-label="The V-model: requirements decompose down the left leg, integration and test climb the right leg, and both meet at a person's judgment">
<defs>
<marker id="v-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker>
<marker id="v-ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2166ac"/></marker>
<marker id="v-aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
</defs>
<!-- left leg: specify -->
<rect class="box" x="0" y="88" width="250" height="56" rx="10"/><text class="lbl anc" x="125" y="123">System requirements</text>
<rect class="box" x="90" y="186" width="250" height="56" rx="10"/><text class="lbl anc" x="215" y="221">Subsystem requirements</text>
<rect class="box" x="180" y="284" width="250" height="56" rx="10"/><text class="lbl anc" x="305" y="319">Component specifications</text>
<!-- bottom -->
<rect class="grey" x="465" y="336" width="250" height="56" rx="10"/><text class="lbl anc" x="590" y="371">Implementation</text>
<!-- right leg: evidence -->
<rect class="mach" x="750" y="284" width="250" height="56" rx="10"/><text class="lbl anc" x="875" y="319">Component tests</text>
<rect class="mach" x="840" y="186" width="250" height="56" rx="10"/><text class="lbl anc" x="965" y="221">Subsystem integration, test</text>
<rect class="machT" x="930" y="88" width="250" height="56" rx="10"/><text class="lbl anc" x="1055" y="123">System tests: evidence</text>
<!-- leg arrows: short connectors between successive steps -->
<path class="arr" d="M150,146 L190,182" marker-end="url(#v-ah)"/>
<path class="arr" d="M240,244 L280,280" marker-end="url(#v-ah)"/>
<path class="arr" d="M400,342 L460,358" marker-end="url(#v-ah)"/>
<path d="M720,358 L780,342" stroke="#2166ac" stroke-width="1.5" fill="none" marker-end="url(#v-ahb)"/>
<path d="M900,280 L940,244" stroke="#2166ac" stroke-width="1.5" fill="none" marker-end="url(#v-ahb)"/>
<path d="M990,182 L1030,146" stroke="#2166ac" stroke-width="1.5" fill="none" marker-end="url(#v-ahb)"/>
<text class="sub" x="6" y="268">decompose ↓</text>
<text class="sub blu" x="1012" y="318">integrate, test ↑</text>
<!-- traceability across the V -->
<path class="arrM dash" d="M344,214 H836"/>
<path class="arrM dash" d="M434,312 H746"/>
<text class="sub anc" x="590" y="205">traced: each requirement to its test</text>
<!-- top: both meet at the person's judgment -->
<rect class="human" x="380" y="10" width="420" height="100" rx="12"/>
<text class="amb anc" x="590" y="50" style="font-size:24px;font-weight:700">Judgment by a qualified engineer</text>
<text class="lbl anc" x="590" y="84">Will it perform as intended in the field?</text>
<path class="arr" d="M254,104 H374" marker-end="url(#v-ah)"/>
<path d="M926,104 H806" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#v-aha)"/>
</svg>
<div style="display:flex;gap:28px;margin-top:22px;font-size:22px;line-height:1.3">
<div style="flex:1"><b>Why</b><br>Trust systems too complex for anyone to hold in their head.</div>
<div style="flex:1"><b>What</b><br>Ranges of acceptable behavior, under stated operating assumptions.</div>
<div style="flex:1"><b>How</b><br>Decompose down, integrate and test up, until evidence supports the judgment.</div>
</div>
</div>
